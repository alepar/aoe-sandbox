name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/alepar/aoe-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry layer cache (stored as a :buildcache tag in GHCR). Unchanged
          # layers - including the slow Rust/BoringSSL/gopls compiles - restore from
          # cache instead of rebuilding. Registry (not gha) cache because the
          # multi-arch cache exceeds gha's 10GB limit. mode=max caches intermediate
          # layers too; image-manifest/oci-mediatypes keep it GHCR-compatible.
          cache-from: type=registry,ref=ghcr.io/alepar/aoe-sandbox:buildcache
          cache-to: type=registry,ref=ghcr.io/alepar/aoe-sandbox:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          # mykb release lives in the public alepar/mykb repo; the built-in
          # GITHUB_TOKEN suffices (raises the API rate limit, no PAT needed).
          secrets: |
            mykb_token=${{ secrets.GITHUB_TOKEN }}
